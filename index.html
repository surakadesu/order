<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SURAKA</title>
  <!-- 連結外部 CSS 檔案 -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <h2>SURAKA</h2>
      <div class="subtitle">喊單計算器</div>
    </header>

    <div class="form-grid">
      <div class="col">
        <label for="itemName">品項名稱 (ITEM NAME)</label>
        <input type="text" id="itemName" placeholder="請輸入商品名稱" autocomplete="off" />
      </div>

      <div class="row-group">
        <div class="col">
          <label for="rate">匯率 (RATE)</label>
          <input type="number" id="rate" step="0.001" value="0.24" inputmode="decimal" />
        </div>
        <div class="col">
          <label for="yen">日幣 (JPY)</label>
          <input type="number" id="yen" placeholder="¥ 0" inputmode="decimal" />
        </div>
      </div>

      <div class="row-group">
        <div class="col">
          <label for="qty">數量 (QTY)</label>
          <input type="number" id="qty" value="1" min="1" inputmode="numeric" />
        </div>
        <div class="col">
          <label for="twd">預估單價 (TWD)</label>
          <input type="text" id="twd" readonly placeholder="$ 0" tabindex="-1" />
        </div>
      </div>
    </div>

    <div class="btn-group">
      <button id="addBtn">ADD ITEM</button>
      <button id="copyBtn">COPY LIST</button>
      <button id="clearBtn" title="RESET ALL">🗑️</button>
    </div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th width="40%">品項</th>
            <th width="20%">單價</th>
            <th width="15%">數量</th>
            <th width="20%">小計</th>
            <th width="5%"></th>
          </tr>
        </thead>
        <tbody id="listBody"></tbody>
        <tfoot>
          <tr>
            <td colspan="3" style="text-align: left; padding-left: 18px;">TOTAL</td>
            <td id="total">$0</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </div>
  </div>

  <!-- 連結外部 JS 檔案 -->
  <script src="script.js"></script>
</body>
</html>
